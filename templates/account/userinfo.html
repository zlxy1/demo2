{% extends 'layout.html' %}
{% block content %}
<style>
    /* 全局统一主题配色，和列表页面政务蓝保持一致 #0F3460 */
    .theme-header {
        color: #0F3460;
    }
    .btn-primary {
        background-color: #0F3460;
        border-color: #0F3460;
    }
    .btn-outline-primary {
        color: #0F3460;
        border-color: #0F3460;
    }
    .btn-outline-primary:hover {
        background-color: #0F3460;
        border-color: #0F3460;
    }
</style>

<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm mt-3">
            <div class="card-body p-4">
                <h4 class="text-center mb-4 theme-header">个人信息</h4>

                <!-- 居中圆形大头像 -->
                <div class="text-center mb-4">
                    <img
                            src="{{ request.user.profile.avatar.url }}"
                            alt="头像"
                            class="rounded-circle object-fit-cover border border-secondary"
                            style="width: 120px; height: 120px;"
                    >
                </div>

                <div class="py-2 fs-5">
                    <p class="mb-3">用户名：{{ request.user.username }}</p>
                    <p class="mb-3">昵称：{{ request.user.profile.nickname }}</p>
                    <p class="mb-3">所在部门：{{ request.user.profile.dep }}</p>
                    <p class="mb-3">账号类型：
                        {% if is_super %}
                            超级管理员
                        {% elif is_admin %}
                            管理员
                        {% else %}
                            普通注册用户
                        {% endif %}
                    </p>
                </div>

                <hr>

                <div class="mt-3 d-grid gap-2">
                    <a href="{% url 'change_pwd' %}" class="btn btn-outline-primary btn-sm">前往修改密码</a>
                    <a href="{% url 'upload' %}" class="btn btn-outline-primary btn-sm">修改个人资料</a>
                    <a href="{% url 'staff_list' %}" class="btn btn-primary btn-sm">返回员工列表首页</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
