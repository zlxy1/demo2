{% extends 'layout.html' %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-4 mt-3">
                <h4 class="text-center mb-4">个人信息</h4>

                <!-- 居中圆形大头像 BS样式 -->
                <div class="text-center mb-4">
                    <img 
                        src="{{ user.profile.avatar.url }}" 
                        alt="头像"
                        class="rounded-circle object-fit-cover border border-secondary"
                        style="width: 120px; height: 120px;"
                    >
                </div>

                <div class="py-2 fs-5">
                    <p class="mb-3">用户名：{{ user.username }}</p>
                    <p class="mb-3">昵称：{{ user.profile.nickname }}</p>
                    <p class="mb-3">账号类型：
                        {% if user.is_superuser %}
                            超级管理员
                        {% else %}
                            普通注册用户
                        {% endif %}
                    </p>
                </div>

                <hr>

                <div class="mt-3 d-grid gap-2">
                    <a href="{% url 'change_pwd' %}" class="btn btn-outline-primary">前往修改密码</a>
                    <a href="{% url 'upload' %}" class="btn btn-outline-primary">修改个人资料</a>
                    <a href="{% url 'staff_list' %}" class="btn btn-primary">返回员工列表首页</a>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
