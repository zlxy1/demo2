<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册</title>
    <!-- 引入Bootstrap样式 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container">
    <div class="row justify-content-center min-vh-100 align-items-center">
        <div class="col-md-4 col-lg-3">
            <div class="card p-4 shadow-sm">
                <h3 class="text-center mb-4">新用户注册</h3>

                <!-- 错误提示 -->
                {% if msg %}
                    <div class="alert alert-danger text-center py-2">
                        {{ msg }}
                    </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">用户名</label>
                        <input type="text" name="username" class="form-control" placeholder="请输入用户名">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">所在科室</label>
                        <select name="dep" class="form-select">
                            <option value="" selected>请选择科室</option>
                            {% for v,k in dep %}
                                <option value="{{ v }}">{{ k }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">设置密码</label>
                        <input type="password" name="password1" class="form-control" placeholder="请输入密码">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">确认密码</label>
                        <input type="password" name="password2" class="form-control" placeholder="再次输入密码">
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">立即注册</button>
                    </div>
                </form>

                <p class="text-center mt-3 mb-0">
                    已有账号？
                    <a href="{% url 'login_view' %}" class="text-primary">前往登录</a>
                </p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
