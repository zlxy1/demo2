<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #0F3460;
        }
        .card {
            background-color: #ffffff;
            border: none;
            border-radius: 10px;
        }
        .card h3 {
            color: #0F3460;
        }
        .input-group-text {
            background-color: #f1f5f9;
            border-color: #dee2e6;
            color: #0F3460;
        }
        .form-control:focus,
        .form-select:focus {
            border-color: #0F3460;
            box-shadow: 0 0 0 0.25rem rgba(15, 52, 96, 0.25);
        }
        .btn-primary {
            background-color: #0F3460;
            border-color: #0F3460;
        }
        .btn-primary:hover {
            background-color: #0c2a4d;
            border-color: #0c2a4d;
        }
        .text-primary {
            color: #0F3460 !important;
        }
        .text-primary:hover {
            color: #0c2a4d !important;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center min-vh-100 align-items-center">
        <div class="col-md-4 col-lg-3">
            <div class="card p-4 shadow-lg">
                <h3 class="text-center mb-4">新用户注册</h3>

                {% if msg %}
                    <div class="alert alert-danger text-center py-2 mb-3">
                        {{ msg }}
                    </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">用户名</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="请输入用户名" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">所在科室</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-building"></i></span>
                            <select name="dep" class="form-select" required>
                                <option value="" selected>请选择科室</option>
                                {% for v,k in dep %}
                                    <option value="{{ v }}">{{ k }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">设置密码</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password1" class="form-control" placeholder="请输入密码" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">确认密码</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" name="password2" class="form-control" placeholder="再次输入密码" required>
                        </div>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">立即注册</button>
                    </div>
                </form>

                <p class="text-center mt-3 mb-0">
                    已有账号？
                    <a href="{% url 'login_view' %}" class="text-primary text-decoration-none">前往登录</a>
                </p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
