<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账户登录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        /* 页面深蓝背景，和后台顶部导航 #0F3460 色系统一 */
        body {
            background-color: #0F3460;
        }
        /* 白色登录卡片 */
        .card {
            background-color: #ffffff;
            border: none;
            border-radius: 10px;
        }
        .card h3 {
            color: #0F3460;
        }
        /* 输入框群组样式 */
        .input-group-text {
            background-color: #f1f5f9;
            border-color: #dee2e6;
            color: #0F3460;
        }
        .form-control:focus {
            border-color: #0F3460;
            box-shadow: 0 0 0 0.25rem rgba(15, 52, 96, 0.25);
        }
        /* 主按钮配色，全局统一政务蓝 */
        .btn-primary {
            background-color: #0F3460;
            border-color: #0F3460;
        }
        .btn-primary:hover {
            background-color: #0c2a4d;
            border-color: #0c2a4d;
        }
        /* 链接颜色 */
        .text-primary {
            color: #0F3460 !important;
        }
        .text-primary:hover {
            color: #0c2a4d !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center min-vh-100 align-items-center">
            <div class="col-md-4 col-lg-3">
                <div class="card p-4 shadow-lg">
                    <h3 class="text-center mb-4">人员信息管理系统</h3>

                    {% if msg %}
                    <div class="alert alert-danger text-center py-2 mb-3">
                        {{ msg }}
                    </div>
                    {% endif %}

                    <form action="{% url 'login_view' %}" method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label">账号</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" name="username" class="form-control" placeholder="请输入您的用户名" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">密码</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" name="password" class="form-control" placeholder="请输入密码" required>
                            </div>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">登录系统</button>
                        </div>
                    </form>

                    <p class="text-center mt-3 mb-0">
                        没有账号？
                        <a href="{% url 'register' %}" class="text-primary text-decoration-none">前往注册</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
