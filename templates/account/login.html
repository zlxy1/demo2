<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>账户登录</title>
</head>
<body>
<h2>用户信息登录</h2>
<div>
    <form action="{% url 'login_view' %}" method="post">
        {% csrf_token %}
        {% if msg%}
            <P>{{ msg }}</P>
        {% endif %}
        <label>
            账号
            <input type="text" name="username" placeholder="请输入您的用户名">
        </label><br>
        <label>
            密码
            <input type="password" name="password" placeholder="请输入密码">
        </label><br>
        <input type="submit" value="登录">

    </form>
</div>

</body>
</html>
