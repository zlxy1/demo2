{% extends 'layout.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4 mt-3">
            <h4 class="text-center mb-4">修改登录密码</h4>

            <!-- 提示消息 -->
            {% if msg %}
                {% if msg == "密码修改成功！" %}
                    <div class="alert alert-success text-center py-2">{{ msg }}</div>
                {% else %}
                    <div class="alert alert-danger text-center py-2">{{ msg }}</div>
                {% endif %}
                <div class="mb-3"></div>
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">原密码</label>
                    <input type="password" name="old_pwd" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">新密码</label>
                    <input type="password" name="new_pwd1" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">确认新密码</label>
                    <input type="password" name="new_pwd2" class="form-control" required>
                </div>

                <div class="mt-3">
                    <button type="submit" class="btn btn-primary w-100">确认修改</button>
                </div>
            </form>

            <div class="text-center mt-3">
                <a href="{% url 'userinfo' %}" class="text-secondary">返回个人中心</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
