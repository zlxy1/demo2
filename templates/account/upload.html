{% extends 'layout.html' %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-4 mt-4">
                <h4 class="text-center mb-4">更换头像 & 修改昵称</h4>

                <!-- 提示消息 -->
                {% if msg %}
                    <div class="alert alert-danger text-center py-2 mb-4">
                        {{ msg }}
                    </div>
                {% endif %}
                
                <!-- 展示当前头像 居中大号预览 -->
                <div class="text-center mb-4">
                    <img
                            src="{{ request.user.profile.avatar.url }}"
                            alt="头像"
                            class="rounded-circle object-fit-cover border border-secondary"
                            style="width: 120px; height: 120px;"
                    >
                    <p class="text-secondary mt-2 mb-0">当前头像</p>
                </div>

                <!-- 文件上传表单 -->
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">选择图片</label>
                        <input class="form-control" type="file" name="avatar" accept="image/*">
                    </div>

                    <div class="mb-4">
                        <label class="form-label">修改昵称</label>
                        <input
                                type="text"
                                class="form-control"
                                name="nickname"
                                value="{{ request.user.profile.nickname }}"
                        >
                    </div>
                    <div class="mb-3">
                        <label class="form-label">所在科室</label>
                        <select name="dep" class="form-select">
                            <option value="" selected>请选择科室</option>
                            {% for v,k in dep %}
                                <option value="{{ v }}">{{ k }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">保存修改</button>
                </form>

                <div class="mt-4 text-center">
                    <a href="{% url 'userinfo' %}" class="btn btn-outline-secondary">返回个人中心</a>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
