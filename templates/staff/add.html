<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>添加人员</title>
</head>
<body>
<h3>添加人员信息</h3>
<form action="" method="post">
    {% csrf_token %}
    <div>
        <label>姓名：</label>
        <label>
            <input type="text" name="name" required>
        </label>
    </div>
    <br>

    <div>
        <label>性别：</label>
        <label>
            <select name="gender" required>
                <option value="">请选择性别</option>
                <!-- 遍历后端传来的性别列表 -->
                {% for key, show_text in gender_list %}
                    <option value="{{ key }}">{{ show_text }}</option>
                {% endfor %}
            </select>
        </label>
    </div>
    <br>

    <div>
        <label>出生日期：</label>
        <label>
            <input type="date" name="birth" required>
        </label>
    </div>
    <br>

    <div>
        <label>身份证号：</label>
        <label>
            <input type="text" name="id_number" maxlength="18" required>
        </label>
    </div>
    <br>

    <div>
        <label>人员类型：</label>
        <label>
            <select name="staff_type" required>
                <option value="">请选择人员类型</option>
                {% for key, show_text in staff_type_list %}
                    <option value="{{ key }}">{{ show_text }}</option>
                {% endfor %}
            </select>
        </label>
    </div>
    <br>

    <div>
        <label>在职状态：</label>
        <label>
            <select name="work_status" required>
                <option value="">请选择在职状态</option>
                {% for key, show_text in work_status_list %}
                    <option value="{{ key }}">{{ show_text }}</option>
                {% endfor %}
            </select>
        </label>
    </div>
    <br>

    <div>
        <label>所属科室：</label>
        <label>
            <select name="work_area" required>
                <option value="">请选择科室</option>
                {% for key, show_text in area_choice_list %}
                    <option value="{{ key }}">{{ show_text }}</option>
                {% endfor %}
            </select>
        </label>
    </div>
    <br>

    <div>
        <input type="submit" value="提交保存">
        <a href="{% url 'staff_list' %}">返回员工列表</a>
    </div>
</form>
</body>
</html>
