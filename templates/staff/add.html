{% extends 'layout.html' %}
{% block content %}
<style>
    /* 统一主题政务蓝 #0F3460，全站页面色彩保持一致 */
    .theme-title {
        color: #0F3460;
    }
    .btn-primary {
        background-color: #0F3460;
        border-color: #0F3460;
    }
    .btn-outline-primary {
        color: #0F3460;
        border-color: #0F3460;
    }
    .btn-outline-primary:hover {
        background-color: #0F3460;
        border-color: #0F3460;
    }
</style>

<div class="card shadow-sm">
    <div class="card-body p-4">
        <h4 class="mb-4 theme-title">添加人员信息</h4>

        <form action="" method="post">
            {% csrf_token %}

            <!-- 姓名 -->
            <div class="mb-3">
                <label class="form-label">姓名</label>
                <input type="text" name="name" class="form-control form-control-sm" required>
            </div>

            <!-- 性别 -->
            <div class="mb-3">
                <label class="form-label">性别</label>
                <select name="gender" class="form-select form-select-sm" required>
                    <option value="">请选择性别</option>
                    {% for key, show_text in gender_list %}
                        <option value="{{ key }}">{{ show_text }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- 出生日期 -->
            <div class="mb-3">
                <label class="form-label">出生日期</label>
                <input type="date" name="birth" class="form-control form-control-sm" required>
            </div>

            <!-- 身份证号 -->
            <div class="mb-3">
                <label class="form-label">身份证号</label>
                <input type="text" name="id_number" maxlength="18" class="form-control form-control-sm" required>
            </div>

            <!-- 人员类型 -->
            <div class="mb-3">
                <label class="form-label">人员类型</label>
                <select name="staff_type" class="form-select form-select-sm" required>
                    <option value="">请选择人员类型</option>
                    {% for key, show_text in staff_type_list %}
                        <option value="{{ key }}">{{ show_text }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- 在职状态 -->
            <div class="mb-3">
                <label class="form-label">在职状态</label>
                <select name="work_status" class="form-select form-select-sm" required>
                    <option value="">请选择在职状态</option>
                    {% for key, show_text in work_status_list %}
                        <option value="{{ key }}">{{ show_text }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- 所属科室 -->
            <div class="mb-3">
                <label class="form-label">所属科室</label>
                <select name="work_area" class="form-select form-select-sm" required>
                    <option value="">请选择科室</option>
                    {% for key, show_text in area_choice_list %}
                        <option value="{{ key }}">{{ show_text }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- 底部按钮 -->
            <div class="mt-4">
                <button type="submit" class="btn btn-success btn-sm">提交保存</button>
                <a href="{% url 'staff_list' %}" class="btn btn-outline-secondary btn-sm ms-2">返回员工列表</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
