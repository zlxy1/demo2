{% extends 'layout.html' %}

{% block content %}
<div class="card p-4">
    <h4 class="mb-4">批量导入员工信息（Excel文件）</h4>

    <!-- 消息提示：区分成功/错误样式 -->
    {% if msg %}
    <div class="alert {% if is_success %}alert-success{% else %}alert-danger{% endif %} alert-dismissible fade show" role="alert">
        {{ msg }}
    </div>
    {% endif %}

    <!-- 文件上传表单 必须携带enctype上传文件 -->
    <form action="" method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <!-- Excel文件选择框 -->
        <div class="mb-3">
            <label class="form-label">选择Excel表格文件</label>
            <input class="form-control" type="file" name="excel" accept=".xlsx,.xls" required>
            <div class="form-text">仅支持 .xlsx / .xls 格式Excel文件</div>
        </div>

        <!-- 操作按钮 -->
        <div class="mt-4">
            <button type="submit" class="btn btn-primary">开始导入</button>
            <a href="{% url 'staff_list' %}" class="btn btn-outline-secondary ms-2">返回员工列表</a>
        </div>
    </form>
</div>
{% endblock %}
