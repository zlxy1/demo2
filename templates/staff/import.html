<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>员工Excel导入</title>
    <style>
        .box {
            width: 500px;
            margin: 80px auto;
            padding: 30px;
            border: 1px solid #eee;
            border-radius: 8px;
        }
        .tip {
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        .success {
            background-color: #e6f7ff;
            color: #1890ff;
        }
        .error {
            background-color: #fff2f0;
            color: #f5222d;
        }
        input {
            margin: 15px 0;
        }
        button {
            padding: 8px 22px;
            cursor: pointer;
            background: #165DFF;
            color: white;
            border: none;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h3>批量导入员工信息</h3>

        <!-- 展示后端返回的提示消息 -->
        {% if msg %}
            <div class="tip">{{ msg }}</div>
        {% endif %}

        <!-- 上传表单：post提交，enctype必须加，否则文件传不到后端 -->
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div>
                <label>选择Excel文件(.xlsx)</label>
                <br>
                <input type="file" name="excel" accept=".xlsx" required>
            </div>
            <button type="submit">开始导入</button>
        </form>
    </div>
</body>
</html>
