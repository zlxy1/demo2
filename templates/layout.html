<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    {% block extra_css %}{% endblock %}
</head>
<body>

<!-- 顶部导航栏 -->
<!-- 顶部导航栏 -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 px-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'staff_list' %}">员工管理后台</a>

        <!-- 右侧头像+用户名下拉菜单 -->
        <div class="dropdown ms-auto d-flex align-items-center">
            <button class="btn btn-dark dropdown-toggle d-flex align-items-center gap-2 border-0" type="button"
                    data-bs-toggle="dropdown" aria-expanded="false">
                <!-- 内置用户图标 -->
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="white" class="bi bi-person-circle"
                     viewBox="0 0 16 16">
                    <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/>
                    <path d="M0 8a8 8 0 1 0 16 0A8 8 0 0 0 0 8zm8-7a7 7 0 0 0-7 7c0 1.355.68 2.565 1.745 3.43a3 3 0 0 1 3.162.478 3 3 0 0 1 4.997-3.1A7 7 0 0 0 8 1z"/>
                </svg>
                <span>{{ user.username }}</span>
            </button>

            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="{% url 'userinfo' %}">个人中心</a></li>
                <li><a class="dropdown-item" href="{% url 'change_pwd' %}">修改密码</a></li>
                <li>
                    <hr class="dropdown-divider">
                </li>
                <li>
                    <form action="{% url 'logout_view' %}" method="post" class="m-0">
                        {% csrf_token %}
                        <button class="dropdown-item text-danger w-100 text-start border-0 bg-transparent">
                            退出登录
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
