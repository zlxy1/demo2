<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人员信息管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    {% block extra_css %}{% endblock %}
    <style>
        html, body {
            height: 100%;
            margin: 0;
            background: #f5f7fa;
        }

        /* 整体外层弹性框架 */
        .layout-wrapper {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 顶部导航 深色政务蓝 */
        .navbar {
            padding: 0.4rem 1.2rem !important;
            margin-bottom: 0 !important;
            background-color: #0F3460 !important;
        }

        .navbar .navbar-brand,
        .navbar .dropdown-toggle {
            color: #fff !important;
        }

        .body-container {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* 侧边栏基础样式，默认展开宽度 */
        .sidebar {
            width: 190px;
            min-width: 190px;
            background: #ffffff;
            border-right: 1px solid #e4e7ed;
            flex-shrink: 0;
            overflow-y: auto;
            transition: width 0.3s ease, min-width 0.3s ease;
        }

        /* 侧边栏收起状态：仅显示图标窄栏 */
        .sidebar.collapse-side {
            width: 64px;
            min-width: 64px;
        }

        .sidebar.collapse-side .menu-text {
            display: none;
        }

        .sidebar a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0.6rem 12px;
            color: #4e5969;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.2s;
            margin: 4px 8px;
            border-radius: 6px;
            white-space: nowrap;
            overflow: hidden;
        }

        .sidebar a:hover {
            background: #e8f0fc;
            color: #0F3460;
        }

        /* 切换按钮 */
        .toggle-sidebar-btn {
            margin: 8px;
            width: calc(100% - 16px);
        }

        /* ==========核心改动：主内容自适应边距========== */
        .main-content {
            flex: 1;
            overflow-y: auto;
            /* 基准内边距，侧边展开状态 */
            padding: 16px;
            transition: padding 0.3s ease;
        }

        /* 侧边收起时，缩小左侧padding，补偿宽度差值，视觉留白均衡 */
        .body-container.side-collapsed .main-content {
            padding-left: 8px;
        }

        /* 图标统一大小 */
        .fa {
            font-size: 16px;
            width: 18px;
            text-align: center;
        }

        /* 侧边收起悬浮文字提示 */
        .side-item-wrap {
            position: relative;
        }

        .sidebar.collapse-side .side-item-wrap:hover::after {
            content: attr(data-title);
            position: absolute;
            left: 70px;
            top: 50%;
            transform: translateY(-50%);
            background: #1f2937;
            color: #fff;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 13px;
            z-index: 999;
            white-space: nowrap;
        }
    </style>
</head>
<body>
<div class="layout-wrapper">
    <!-- 顶部导航 -->
    <nav class="navbar navbar-expand-lg navbar-dark px-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'staff_list' %}">人员信息管理系统</a>

            <div class="dropdown ms-auto d-flex align-items-center">
                <button class="btn border-0 d-flex align-items-center gap-2 p-1 text-white" type="button"
                        data-bs-toggle="dropdown" aria-expanded="false">
                    <img
                            src="{{ user.profile.avatar.url }}"
                            alt="用户头像"
                            class="rounded-circle"
                            style="width: 34px; height: 34px;"
                    >
                    <span>{{ user.profile.nickname }}</span>
                </button>

                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" href="{% url 'userinfo' %}">个人中心</a></li>
                    <li><a class="dropdown-item" href="{% url 'change_pwd' %}">修改密码</a></li>
                    <li>
                        <hr class="dropdown-divider">
                    </li>
                    <li>
                        <form action="{% url 'logout_view' %}" method="post" class="m-0">
                            {% csrf_token %}
                            <button class="dropdown-item text-danger w-100 text-start border-0 bg-transparent">
                                退出登录
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="body-container" id="bodyContainer">
        <!-- 侧边导航 -->
        <div class="sidebar" id="sidebar">
            <button class="btn btn-outline-secondary btn-sm toggle-sidebar-btn" id="toggleBtn">
                <span class="menu-text">收起侧边栏</span>
                <span class="menu-icon"><i class="fa fa-bars"></i></span>
            </button>
            <div class="side-item-wrap" data-title="人员信息">
                <a href="{% url 'staff_list' %}">
                    <i class="fa fa-users"></i>
                    <span class="menu-text">人员信息</span>
                </a>
            </div>
            {% if user.is_superuser or user.profile.is_admin %}
                <div class="side-item-wrap" data-title="用户管理">
                    <a href="{% url 'user_manage' %}">
                        <i class="fa fa-user-circle"></i>
                        <span class="menu-text">账户管理</span>
                    </a>
                </div>
            {% endif %}
        </div>

        <div class="main-content">
            {% block content %}{% endblock %}
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
<script>
    const sidebar = document.getElementById('sidebar');
    const toggleBtn = document.getElementById('toggleBtn');
    const bodyContainer = document.getElementById('bodyContainer');

    toggleBtn.addEventListener('click', function () {
        sidebar.classList.toggle('collapse-side');
        bodyContainer.classList.toggle('side-collapsed');

        if (sidebar.classList.contains('collapse-side')) {
            toggleBtn.innerHTML = '<span class="menu-icon"><i class="fa fa-bars"></i></span>';
        } else {
            toggleBtn.innerHTML = '<span class="menu-text">收起侧边栏</span> <span class="menu-icon"><i class="fa fa-bars"></i></span>';
        }
    })
</script>
</body>
</html>
