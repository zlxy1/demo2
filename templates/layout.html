<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 px-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'staff_list' %}">员工管理后台</a>

        <div class="dropdown ms-auto d-flex align-items-center">
            <button class="btn btn-dark dropdown-toggle d-flex align-items-center gap-2 border-0 p-1" type="button"
                    data-bs-toggle="dropdown" aria-expanded="false">
                <!-- Bootstrap 样式圆形头像 -->
                <img
                    src="{{ user.profile.avatar.url }}"
                    alt="用户头像"
                    class="rounded-circle object-fit-cover"
                    style="width: 36px; height: 36px;"
                >
                <span>{{ user.profile.nickname }}</span>
            </button>

            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="{% url 'userinfo' %}">个人中心</a></li>
                <li><a class="dropdown-item" href="{% url 'change_pwd' %}">修改密码</a></li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <form action="{% url 'logout_view' %}" method="post" class="m-0">
                        {% csrf_token %}
                        <button class="dropdown-item text-danger w-100 text-start border-0 bg-transparent">
                            退出登录
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
